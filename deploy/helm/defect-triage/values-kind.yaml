# Local kind cluster: the image is loaded with `kind load docker-image`.
replicaCount: 1
image:
  repository: defect-triage-agent
  tag: local
  pullPolicy: Never
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
config:
  LANGSMITH_TRACING: "false"
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 1Gi
