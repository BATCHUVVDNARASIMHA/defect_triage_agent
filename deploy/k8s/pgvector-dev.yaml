# DEV ONLY: a single Postgres + pgvector pod for the local kind cluster.
# The password is hard-coded on purpose; on AWS the chart points at RDS instead.
apiVersion: v1
kind: Service
metadata:
  name: pgvector
  labels:
    app.kubernetes.io/name: pgvector
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: pgvector
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgvector
  labels:
    app.kubernetes.io/name: pgvector
spec:
  serviceName: pgvector
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgvector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgvector
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: triage
            - name: POSTGRES_PASSWORD
              value: triage
            - name: POSTGRES_DB
              value: triage
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "triage", "-d", "triage"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
